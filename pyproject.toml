[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsmem"
version = "1.0.0"
description = "可配置记忆曲线、三层记忆、自演化评级与人格慢通道的对话记忆内核"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsmem contributors" }]
keywords = ["memory", "llm", "deepseek", "agent", "sqlite", "forgetting-curve"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
dsmem-init = "dsmem.settings:main"
dsmem-webui = "dsmem.webui:main"
dsmem-daily = "dsmem.daily:main"

[tool.setuptools]
packages = ["dsmem"]

[tool.setuptools.package-data]
dsmem = ["schema.sql"]
